name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - name: Test
        shell: bash
        run: go test ./... 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Show failures
        if: failure()
        shell: bash
        run: grep -E "FAIL|panic|_test.go|Error|error" test-output.txt | head -30 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
