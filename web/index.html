<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jira StopWatch NextGen</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0071E3">
<style>
:root{
  /* light (default) */
  --bg:#FFFFFF;--nav:#F5F5F7;--panel:#FFFFFF;--panel2:#F5F5F7;--field:#FFFFFF;--text:#1D1D1F;--muted:#6E6E73;--line:#D2D2D7;--input-line:#D2D2D7;
  --accent:#0071E3;--accent-ink:#FFFFFF;--link:#0066CC;--ok:#16a34a;--warn:#b45309;--danger:#dc2626;--new:#B64400;
  color-scheme:light;
}
/* Shadows are opt-in (Settings): every elevation is a token, and "off" is a zero-size shadow so it is safe inside lists. */
:root{--fs:13px;--sh-1:0 0 0 0 transparent;--sh-2:0 0 0 0 transparent;--sh-3:0 0 0 0 transparent;--shadow:var(--sh-2)}
:root[data-shadows=on]{
  --sh-1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
  --sh-2:0 2px 4px -2px rgba(16,24,40,.06),0 8px 20px -4px rgba(16,24,40,.14);
  --sh-3:0 24px 48px -12px rgba(16,24,40,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-shadows=on]{
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  --sh-2:0 4px 8px -2px rgba(0,0,0,.6),0 12px 28px -4px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  --sh-3:0 24px 48px -12px rgba(0,0,0,.85);
}}
:root[data-theme=dark][data-shadows=on]{
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  --sh-2:0 4px 8px -2px rgba(0,0,0,.6),0 12px 28px -4px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  --sh-3:0 24px 48px -12px rgba(0,0,0,.85);
}
/* no explicit choice: follow the OS */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000000;--nav:#0E0E0E;--panel:#1D1D1F;--panel2:#333336;--field:#000000;--text:#F5F5F7;--muted:#86868B;--line:#333336;--input-line:#6E6E73;
  --accent:#0071E3;--accent-ink:#FFFFFF;--link:#2997FF;--ok:#34d399;--warn:#FFD500;--danger:#f87171;--new:#B64400;
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#000000;--nav:#0E0E0E;--panel:#1D1D1F;--panel2:#333336;--field:#000000;--text:#F5F5F7;--muted:#86868B;--line:#333336;--input-line:#6E6E73;
  --accent:#0071E3;--accent-ink:#FFFFFF;--link:#2997FF;--ok:#34d399;--warn:#FFD500;--danger:#f87171;--new:#B64400;
  color-scheme:dark;
}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.mono{font-variant-numeric:tabular-nums}

/* login */
#login{min-height:100%;display:flex;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.login-card{width:100%;max-width:400px;padding:28px 32px;margin:auto}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.logo svg{width:26px;height:26px}
h1{font-size:calc(var(--fs)*1.6923);margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:calc(var(--fs)*0.9231);font-weight:600;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=datetime-local],textarea,select{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--input-line);background:var(--field);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.check{display:flex;gap:8px;align-items:center;margin:16px 0 0;font-size:calc(var(--fs)*1);color:var(--muted);font-weight:400}
.check input{width:16px;height:16px}
.btn{box-shadow:var(--sh-1);border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%;margin-top:20px;padding:12px}
.err{color:var(--danger);font-size:calc(var(--fs)*1);margin-top:12px;min-height:18px}
.hint{font-size:calc(var(--fs)*0.9231);color:var(--muted);margin-top:6px}
a{color:var(--link)}

/* app shell */
#app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto 1fr;height:100%}
header{position:relative;z-index:5;box-shadow:var(--sh-1);grid-column:1/3;display:flex;align-items:center;gap:10px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--nav)}
header .brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
header .brand i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
header .brand i.live{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.spacer{flex:1}
.total{color:var(--muted)}.total b{color:var(--text);font-size:calc(var(--fs)*1.1538)}
#todayBox b{font-size:calc(var(--fs)*1.3077)}
.iconbtn{box-shadow:var(--sh-1);border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 10px;color:var(--text)}
.iconbtn:hover{border-color:var(--accent)}

main{padding:14px 20px;overflow:auto}
.addrow{display:flex;gap:8px;margin-bottom:10px}
.addrow input{flex:1}
.empty{border:2px dashed var(--line);border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:calc(var(--fs)*1.2308);margin-bottom:4px}

.timer{box-shadow:var(--sh-1);display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;margin-bottom:6px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);transition:border-color .15s, box-shadow .15s}
.timer.running{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent),var(--sh-1)}
.play{box-shadow:var(--sh-1);width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.timer.running .play{background:var(--ok);color:#fff}
.play svg{width:16px;height:16px;fill:currentColor}
.info{min-width:0}
.keyline{display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden}
.keyline>*{flex:none}.keyline .proj{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key{font-weight:700;color:var(--link);text-decoration:none}
.key:hover{text-decoration:underline}
.pill{font-size:calc(var(--fs)*0.8462);padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.summary{text-align:start;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.pill.today{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-weight:600}
.proj{color:var(--muted);font-size:calc(var(--fs)*0.9231)}
.time{font-size:calc(var(--fs)*1.5385);font-weight:600;letter-spacing:-.02em;background:none;border:0;padding:2px 6px;border-radius:8px}
.time:hover{background:var(--panel2)}
.actions{display:flex;gap:6px}
.actions button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:5px 10px;font-weight:600}
.actions button:hover{border-color:var(--accent)}
.actions .x{padding:5px 8px;color:var(--muted)}
.actions .x:hover{color:var(--danger);border-color:var(--danger)}

aside{border-inline-start:1px solid var(--line);background:var(--nav);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:12px 8px 0}
.tabs button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:8px 2px;border-radius:8px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.search{padding:12px}
.filterbar{padding:0 12px 8px}
.list{overflow:auto;padding:0 8px 12px;flex:1}
.issue{display:block;width:100%;text-align:start;border:0;background:none;padding:10px;border-radius:10px}
.issue:hover{background:var(--panel2)}
.issue .t{display:flex;justify-content:space-between;gap:8px}
.issue b{color:var(--link)}
.issue .s{color:var(--muted);font-size:calc(var(--fs)*1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue.added{opacity:.5}
.note{color:var(--muted);padding:20px;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;z-index:50}
.modal{width:100%;max-width:440px;padding:24px;box-shadow:var(--sh-3)}
.modal h2{margin:0 0 2px;font-size:calc(var(--fs)*1.3846)}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal{max-height:92vh;overflow:auto}
.ltr{direction:ltr;text-align:left}
[dir=rtl] .ltr::placeholder{text-align:left}
.langsel{float:inline-end;margin-top:-6px;width:170px}
.combo{position:relative}
.combo>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;padding:10px 12px;border-radius:10px;border:1px solid var(--input-line);background:var(--field)}
.combo>button:focus-visible{outline:2px solid var(--accent)}
.combo>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo .pop{position:absolute;inset-inline:0;top:calc(100% + 4px);z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.combo .pop input{margin-bottom:6px}
.combo ul{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
.combo li{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.combo li small{color:var(--muted);white-space:nowrap}
.combo li.on,.combo li:hover{background:var(--panel2)}
.combo li.sel{font-weight:700}
.combo li.none{color:var(--muted);cursor:default}
.tsearch{margin-bottom:12px}
.updbar{display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--accent)}
.updbar .iconbtn{margin-inline-start:auto;padding:2px 8px}
.timer{-webkit-touch-callout:none}
.timer.dragging{position:relative;z-index:10;box-shadow:var(--sh-3),0 0 0 2px var(--accent);cursor:grabbing;user-select:none;-webkit-user-select:none;transition:none;opacity:.96}
body.dragmode{user-select:none;-webkit-user-select:none;cursor:grabbing}
.pinbtn{flex:none;border:0;background:none;padding:2px;border-radius:6px;color:var(--muted);opacity:.45;line-height:0}
.pinbtn svg{transform:rotate(45deg)}
.pinbtn:hover{opacity:1;color:var(--text)}
.pinbtn.on{opacity:1;color:var(--accent)}
.pinbtn.on svg{transform:none}
.timer.pinned-last{margin-bottom:12px}
.timer.sel{outline:2px solid var(--accent);outline-offset:-2px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;font-size:calc(var(--fs)*0.6923);line-height:1;padding:2px 6px;color:var(--muted)}
.mv button:hover{border-color:var(--accent);color:var(--text)}
.timer{grid-template-columns:auto auto 1fr auto auto}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:36px;padding:0}
.themebtn svg{display:block}
.themewrap{position:absolute;inset-block-start:16px;inset-inline-end:16px}
#login{position:relative}
.modal .foot:empty{display:none}
.modal .btn.block{margin-top:8px}
.modal .check{margin:6px 0 12px}
.modal .foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:80vw}
.toast.bad{background:var(--danger);color:#fff}

/* narrow windows: the issue list becomes a slide-over panel, everything else reflows */
body.aside-closed aside{display:none}
body.aside-closed #app{grid-template-columns:minmax(0,1fr)}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  header{grid-column:1;gap:6px;padding:8px 12px}
  main{padding:14px}
  aside,body.aside-closed aside{display:flex}
  aside{position:fixed;inset-block:0;inset-inline-end:0;width:min(360px,100%);z-index:40;box-shadow:var(--sh-3);
    transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s}
  [dir=rtl] aside{transform:translateX(-100%)}
  body.aside-open aside{transform:none;visibility:visible}
}
header .brand,.total,.clock{white-space:nowrap}
@media (max-width:1000px){ .clock{display:none} }
@media (max-width:520px){ .brand .bt{display:none} }
@media (max-width:360px){ #todayBox span{display:none} }
@media (max-width:600px){
  .clock,.total:not(#todayBox){display:none}
  #pauseAll{font-size:0;width:38px;height:36px;padding:0}
  #pauseAll::before{content:"⏸";font-size:calc(var(--fs)*1.3846)}
  .login-card{padding:22px 18px}
  .langsel{float:none;width:100%;margin:0 0 12px}
  .themewrap{position:static;float:inline-end;margin-bottom:8px}
  .timer{grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px}
  .timer .mv{display:none}
  .timer .play{grid-column:1;grid-row:1/3}
  .timer .info{grid-column:2/4;grid-row:1}
  .timer .time{grid-column:2;grid-row:2;justify-self:start;font-size:calc(var(--fs)*1.5385);padding-inline-start:0}
  .timer .actions{grid-column:3;grid-row:2}
  .addrow{flex-wrap:wrap}
  .modal{padding:18px}
  .modal .row{grid-template-columns:1fr}
  #toast{left:12px;right:12px;bottom:12px;transform:none}
  .toast{max-width:100%}
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="card login-card" id="loginForm" autocomplete="on">
    <div class="themewrap"><button type="button" class="iconbtn themebtn" data-themebtn></button></div>
    <div id="loginLang" class="langsel"></div>
    <div class="logo"><svg viewBox="0 0 32 32"><circle cx="16" cy="18" r="11" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M16 11v7l4 3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="13" y="3" width="6" height="3" rx="1" fill="#fff"/></svg></div>
    <h1>Jira StopWatch NextGen</h1>
    <p class="sub" data-i18n="login.sub"></p>

    <label for="site" data-i18n="login.site"></label>
    <input id="site" class="ltr" type="text" placeholder="yourcompany.atlassian.net / jira.company.com" required autocomplete="url" spellcheck="false">

    <label for="mode" data-i18n="login.mode"></label>
    <select id="mode">
      <option value="cloud" data-i18n="mode.cloud"></option>
      <option value="pat" data-i18n="mode.pat"></option>
      <option value="basic" data-i18n="mode.basic"></option>
    </select>

    <div id="idWrap">
      <label for="email" id="idLabel"></label>
      <input id="email" class="ltr" type="text" placeholder="you@company.com" autocomplete="username" spellcheck="false">
    </div>

    <label for="token" id="secretLabel"></label>
    <input id="token" class="ltr" type="password" autocomplete="current-password">
    <div class="hint" id="modeHint"></div>

    <label class="check"><input id="remember" type="checkbox" checked> <span data-i18n="login.remember"></span></label>
    <div class="hint" id="rememberHint" style="margin-top:4px" data-i18n="login.rememberHint"></div>

    <button class="btn block ghost hidden" id="offlineBtn" type="button" data-i18n="login.offline"></button>
    <button class="btn block" id="loginBtn" type="submit" data-i18n="login.signin"></button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <div class="brand"><i id="live"></i> <span class="bt">Jira StopWatch NextGen</span></div>
    <div class="spacer"></div>
    <div class="clock mono" id="clock" dir="ltr" style="color:var(--muted)"></div>
    <div class="total" id="todayBox" data-tip="hdr.todayTip"><span data-i18n="hdr.today"></span> <b class="mono" id="todayTotal">–</b></div>
    <div class="total hidden" id="pendingBox" data-tip="hdr.pendingTip"><span data-i18n="hdr.pending"></span> <b class="mono" id="total">0m</b></div>
    <button class="iconbtn themebtn" id="asideBtn" type="button" data-tip="search.ph" aria-label="Issues"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    <button class="iconbtn themebtn" data-themebtn type="button"></button>
    <button class="iconbtn" id="pauseAll" data-i18n="hdr.pauseAll"></button>
    <button class="iconbtn themebtn" id="userBtn" type="button" aria-label="Profile"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
  </header>

  <main>
    <div id="offbar" class="updbar hidden"><span data-i18n="login.offlineNote"></span></div>
    <div id="updbar" class="updbar hidden"><span id="updtext"></span> <a id="updlink" target="_blank" rel="noopener"></a> <button type="button" class="iconbtn" id="updx" aria-label="×">✕</button></div>
    <form class="addrow" id="addForm">
      <input id="addKey" class="ltr" type="text" data-ph="add.placeholder" spellcheck="false" autocomplete="off">
      <button class="btn" type="submit" data-i18n="add.btn"></button>
    </form>
    <input id="timerSearch" class="tsearch hidden" type="search" data-ph="timers.filter" autocomplete="off">
    <div id="timers"></div>
  </main>

  <aside>
    <div class="tabs" id="tabs">
      <button data-src="recent" class="on" data-i18n="tab.recent"></button>
      <button data-src="assigned" data-i18n="tab.assigned"></button>
      <button data-src="filter" data-i18n="tab.filters"></button>
      <button data-src="all" data-i18n="tab.all"></button>
      <button data-src="queue" id="queuesTab" class="hidden" data-i18n="tab.queues"></button>
    </div>
    <div class="search" style="display:flex;gap:8px"><input id="q" type="text" data-ph="search.ph" autocomplete="off"><button class="iconbtn hidden" id="jqlBtn" type="button" data-tip="jql.title"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button><button class="iconbtn" id="reload" type="button" data-tip="reload.tip">⟳</button><button class="iconbtn" id="asideClose" type="button" aria-label="Close">✕</button></div>
    <div class="filterbar hidden" id="filterbar"></div>
    <div class="list" id="list"></div>
  </aside>
</div>

<div id="toast"></div>

<script src="i18n.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};

let offlineMode = false;   // running without a Jira connection (see goOffline)
async function api(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method, headers: body ? {"Content-Type": "application/json"} : {},
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch { throw new Error(t("err.appGone")); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && path !== "/api/login" && !offlineMode) showLogin();
    const err = new Error(tr(data.error || `Error ${res.status}`));
    err.code = data.error || "";
    throw err;
  }
  return data;
}

function toast(msg, bad) {
  const x = el("div", {className: "toast" + (bad ? " bad" : ""), textContent: msg});
  $("#toast").append(x);

function fmt(sec, withSec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return withSec ? `${h}:${p(m)}:${p(s)}` : (h ? `${h}h ${m}m` : `${m}m`);
}

/* searchable dropdown: items are {value, label, hint?, search?}; typing filters (accent-insensitive) */
function combo(items, value, onChange, opts = {}) {
  const root = el("div", {className: "combo"});
  const btn = el("button", {type: "button", ariaHasPopup: "listbox"});
  const label = el("span"), caret = el("span", {textContent: "▾"});
  btn.append(label, caret);
  let cur = value, pop = null;
  const find = v => items.find(i => i.value === v);
  const paint = () => { label.textContent = (find(cur) || items[0] || {}).label || ""; };
  function close() { pop?.remove(); pop = null; document.removeEventListener("mousedown", away, true); }
  function away(e) { if (!root.contains(e.target)) close(); }
  function pick(v) { cur = v; paint(); close(); onChange && onChange(v); }
  function open() {
    if (pop) return close();
    const input = el("input", {type: "text", placeholder: t("filter.ph"), autocomplete: "off", spellcheck: false});
    const ul = el("ul", {role: "listbox"});
    pop = el("div", {className: "pop"}, input, ul);
    root.append(pop);
    document.addEventListener("mousedown", away, true);
    let shown = [], idx = 0;
    const draw = () => {
      const q = norm(input.value.trim());
      shown = items.filter(i => !q || norm(i.label + " " + (i.search || "") + " " + (i.value || "")).includes(q));
      idx = Math.max(0, shown.findIndex(i => i.value === cur));
      if (q) idx = 0;
      ul.replaceChildren(...(shown.length ? shown.map((i, n) => {
        const li = el("li", {className: (n === idx ? "on " : "") + (i.value === cur ? "sel" : ""), role: "option"}, el("span", {textContent: i.label, dir: "auto"}));
        if (i.hint) li.append(el("small", {textContent: i.hint, dir: "ltr"}));
        li.onmousedown = e => { e.preventDefault(); pick(i.value); };
        return li;
      }) : [el("li", {className: "none", textContent: t("filter.none")})]));
      ul.querySelector(".on")?.scrollIntoView({block: "nearest"});
    };
    input.oninput = draw;
    input.onkeydown = e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault(); idx = Math.min(shown.length - 1, Math.max(0, idx + (e.key === "ArrowDown" ? 1 : -1)));
        [...ul.children].forEach((li, n) => li.classList.toggle("on", n === idx)); ul.children[idx]?.scrollIntoView({block: "nearest"});
      } else if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); if (shown[idx]) pick(shown[idx].value); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); btn.focus(); }
    };
    draw(); input.focus();
  }
  btn.onclick = open;
  paint(); root.append(btn);
  return {el: root, get: () => cur, set: v => { cur = v; paint(); }};
}

/* Drag and drop: press and hold a card (not its buttons), then drag it to a new place. */
let dragging = null;
(() => {
  const box = $("#timers"), HOLD = 350, SLOP = 8;
  let pend = null, swallowClick = false;
  const cancelPending = () => { if (pend) { clearTimeout(pend.timer); pend = null; } };
  const drop = async ok => {
    const d = dragging; if (!d) return;
    dragging = null;
    d.card.classList.remove("dragging"); d.card.style.transform = ""; document.body.classList.remove("dragmode");
    try { d.card.releasePointerCapture(d.id); } catch {}
    if (!ok) { renderTimers(); return; }
    const prev = d.card.previousElementSibling;
    selKey = d.card.dataset.key;
    await act(`/api/timers/${d.card.dataset.key}/move`, "POST", {after: prev ? prev.dataset.key : ""});
  };
  // lay the card at the pointer; swap with a neighbour once its middle passes that neighbour's middle
  const follow = y => {
    const d = dragging, card = d.card;
    card.style.transform = `translateY(${y - d.startY}px)`;
    for (;;) {
      const r = card.getBoundingClientRect(), mid = r.top + r.height / 2;
      const prev = card.previousElementSibling, next = card.nextElementSibling;
      let other = null, before = false;
      if (prev) { const pr = prev.getBoundingClientRect(); if (mid < pr.top + pr.height / 2) { other = prev; before = true; } }
      if (!other && next) { const nr = next.getBoundingClientRect(); if (mid > nr.top + nr.height / 2) other = next; }
      if (!other || other.dataset.pinned !== card.dataset.pinned) break;   // pinned cards stay above unpinned ones
      const visual = r.top;
      box.insertBefore(card, before ? other : other.nextSibling);
      card.style.transform = "";
      d.startY = y - (visual - card.getBoundingClientRect().top);
      card.style.transform = `translateY(${y - d.startY}px)`;
    }
    const m = $("main").getBoundingClientRect();
    if (y < m.top + 40) $("main").scrollBy(0, -12); else if (y > m.bottom - 40) $("main").scrollBy(0, 12);
  };
  box.addEventListener("pointerdown", e => {
    const card = e.target.closest(".timer");
    if (!card || (e.pointerType === "mouse" && e.button !== 0) || e.target.closest("button,a,input,textarea,select") || dragging) return;
    cancelPending();
    pend = {x: e.clientX, y: e.clientY, id: e.pointerId, card, timer: setTimeout(() => {
      const p = pend; pend = null;
      dragging = {card: p.card, id: p.id, startY: p.y, lastY: p.y};
      try { p.card.setPointerCapture(p.id); } catch {}
      p.card.classList.add("dragging"); document.body.classList.add("dragmode");
      if (navigator.vibrate) navigator.vibrate(15);
    }, HOLD)};
  });
  box.addEventListener("pointermove", e => {
    if (pend && Math.hypot(e.clientX - pend.x, e.clientY - pend.y) > SLOP) cancelPending();
    if (dragging && e.pointerId === dragging.id) { dragging.lastY = e.clientY; follow(e.clientY); }
  });
  const end = ok => e => { cancelPending(); if (dragging && e.pointerId === dragging.id) { swallowClick = true; setTimeout(() => swallowClick = false, 0); drop(ok); } };
  box.addEventListener("pointerup", end(true));
  box.addEventListener("pointercancel", end(false));
  box.addEventListener("click", e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  box.addEventListener("contextmenu", e => { if (pend || dragging) e.preventDefault(); });
  document.addEventListener("touchmove", e => { if (dragging) e.preventDefault(); }, {passive: false});
  document.addEventListener("keydown", e => { if (e.key === "Escape" && dragging) drop(false); });
})();

function tick() {
  let total = 0, any = false;
  for (const x of timers) {
    const s = elapsed(x); total += s; any ||= x.running;
    const b = document.querySelector(`.time[data-key="${x.key}"]`);
    if (b) b.textContent = fmt(s, true);
  }
  $("#total").textContent = fmt(total);
  $("#pendingBox").classList.toggle("hidden", total < 60);   // time on the cards that is not in Jira yet
  $("#live").classList.toggle("live", any);
  document.title = any ? "● " + fmt(total) + " — Jira StopWatch NextGen" : "Jira StopWatch NextGen";
}
setInterval(() => { if (!$("#app").classList.contains("hidden")) { tick(); updateClock(); } }, 1000);

  loadList();
}

const inContext = () => (src === "queue" && queueSel) || src === "filter" || (src === "all" && jqlText);
const matchesQ = (i, q) => !q || norm([i.key, i.summary, i.status].join(" ")).includes(norm(q));
async function loadList() {
  const seq = ++listSeq, q = $("#q").value.trim();
  loading = false;   // this call replaces whatever was loading; an abandoned request must never leave the list stuck blank
  let url = "/api/issues?src=" + src;
  if (src === "queue" && !queueSel) { if (deskCombo) loadQueues(seq); return; }   // the list of queues itself
  // A tab with something chosen (a queue, a saved filter, a JQL result) always shows that; what is typed in the
  // search box then only narrows the loaded list (renderList). Everywhere else the box searches all of Jira.
  if (src === "queue") url += `&desk=${deskCombo.get()}&queue=${queueSel.id}`;
  else if (src === "filter") { if (!filterCombo) return; url += "&filter=" + filterCombo.get(); }
  else if (src === "all" && jqlText) url += "&jql=" + encodeURIComponent(jqlText);
  else if (q) url = "/api/issues?src=search&q=" + encodeURIComponent(q);
  loading = true; listBase = url; listNext = "";
  $("#list").replaceChildren(el("div", {className: "note"}, el("span", {className: "spin"})));
  try {
    const d = await api("GET", url);
    if (seq === listSeq) { loading = false; listNext = d.next || ""; setList(d.issues, "list.none"); }
  } catch (ex) { if (seq === listSeq) { loading = false; setList([], ex.message, true); } }
}
/* ---------- Jira Service Management queues: pick a service project, then a queue, then see its issues ---------- */
let desks = [], deskCombo = null, queueSel = null, queueList = [];
async function loadDesks() {
  if (offlineMode) return;
  try { desks = await api("GET", "/api/queues/desks"); } catch { desks = []; }
  deskCombo = null; queueSel = null;
  $("#queuesTab").classList.toggle("hidden", !desks.length);   // no Service Management (or no access): no tab
}
function loadQueueTab() {
  queueSel = null;
  if (!desks.length) { setList([], "queue.none"); return; }
  if (!deskCombo) {
    deskCombo = combo(desks.map(d => ({value: d.id, label: d.name, hint: d.key, search: d.key + " " + d.name})), desks[0].id, () => { queueSel = null; $("#q").value = ""; showQueueBar(); loadList(); });
  }
  showQueueBar(); loadList();
}
function showQueueBar() {
  const bar = $("#filterbar");
  if (!queueSel) { bar.replaceChildren(deskCombo.el); return; }
  const back = el("button", {type: "button", className: "iconbtn", textContent: "‹", ariaLabel: "Back"});
  back.style.padding = "2px 10px";
  back.onclick = () => { queueSel = null; $("#q").value = ""; showQueueBar(); loadList(); };
  const name = el("b", {textContent: queueSel.name, dir: "auto", title: queueSel.name});
  name.style.cssText = "flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
  bar.replaceChildren(el("div", {style: "display:flex;gap:8px;align-items:center"}, back, name));
}
async function loadQueues(seq) {
  loading = true; listNext = "";
  $("#list").replaceChildren(el("div", {className: "note"}, el("span", {className: "spin"})));
  try {
    const d = await api("GET", "/api/queues?desk=" + encodeURIComponent(deskCombo.get()));
    if (seq !== listSeq) return;
    loading = false; queueList = d; renderQueueList();
  } catch (ex) { if (seq === listSeq) { loading = false; setList([], ex.message, true); } }
}
function renderQueueList() {
  const box = $("#list"), q = norm($("#q").value.trim());
  box.replaceChildren();
  const rows = queueList.filter(x => !q || norm(x.name).includes(q));
  if (!rows.length) { box.append(el("div", {className: "note", textContent: t("queue.none")})); return; }
  for (const x of rows) {
    const b = el("button", {className: "issue", title: x.name},
      el("div", {className: "t"}, el("b", {textContent: x.name, dir: "auto"}), el("span", {className: "pill", textContent: String(x.count)})));
    b.onclick = () => { queueSel = {id: x.id, name: x.name}; $("#q").value = ""; showQueueBar(); loadList(); };
    box.append(b);
  }
}

// "Load more": the next page of the same query, appended below what is already shown.
let listBase = "", listNext = "";
async function loadMore(btn) {
  const seq = listSeq;
  btn.disabled = true;
  try {
    const d = await api("GET", listBase + "&cursor=" + encodeURIComponent(listNext));
    if (seq !== listSeq) return;
    const box = $("#list"), top = box.scrollTop;
    listNext = d.next || ""; listData = listData.concat(d.issues); renderList(); box.scrollTop = top;
  } catch (ex) { btn.disabled = false; toast(ex.message, true); }
}
function setList(d, msg, raw) { listData = d; listMsg = raw ? msg : t(msg); listKey = raw ? null : msg; renderList(); }
let listMsg = "", listKey = "list.none", loading = false;
function renderList() {
  const box = $("#list");
  if (loading) return;
  if (src === "queue" && !queueSel) { renderQueueList(); return; }
  box.replaceChildren();
  const qv = $("#q").value.trim(), rows = inContext() ? listData.filter(i => matchesQ(i, qv)) : listData;
  if (!rows.length) { box.append(el("div", {className: "note", textContent: listData.length ? t("list.none") : (listKey ? t(listKey) : listMsg)})); }
  const have = new Set(timers.map(x => x.key));
  for (const i of rows) {
    const b = el("button", {className: "issue" + (have.has(i.key) ? " added" : ""), title: i.summary},
      el("div", {className: "t"}, el("b", {textContent: i.key, dir: "ltr"}), el("span", {className: "pill", textContent: i.status, dir: "auto"})),
      el("div", {className: "s", dir: "auto", textContent: i.summary}));
    b.onclick = () => have.has(i.key) ? toast(t("list.already", {key: i.key})) : addIssue(i.key);
    box.append(b);
  }
  if (listNext) {
    const more = el("button", {type: "button", className: "btn ghost", textContent: t("list.more")});
    more.style.cssText = "display:block;margin:8px auto 4px";
    more.onclick = () => loadMore(more);
    box.append(more);
  }
}

/* ---------- keyboard shortcuts (same as the original StopWatch) ---------- */
const typing = e => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
document.addEventListener("keydown", e => {
  if (!e.ctrlKey || e.altKey || e.metaKey || $("#app").classList.contains("hidden") || document.querySelector(".scrim")) return;
  const x = selected();
  const run = f => { e.preventDefault(); f(); };
  switch (e.key) {
    case "ArrowUp": if (x) run(() => move(x.key, -1)); break;
    case "ArrowDown": if (x) run(() => move(x.key, 1)); break;
    case "p": case "P": if (x) run(() => { selKey = x.key; act(`/api/timers/${x.key}/${x.running ? "pause" : "start"}`); }); break;
    case "l": case "L": if (x) run(() => logDialog(x)); break;
    case "e": case "E": if (x) run(() => editTime(x)); break;
    case "r": case "R": if (x) run(() => act(`/api/timers/${x.key}/reset`)); break;
    case "Delete": if (x) run(() => { if (confirmRemove(x)) act(`/api/timers/${x.key}`, "DELETE"); }); break;
    case "i": case "I": case "n": case "N": run(() => $("#addKey").focus()); break;
    case "o": case "O": if (x) run(() => openJira(null, `${site}/browse/${x.key}`)); break;
    case "c": case "C": if (x && !typing(e) && !getSelection().toString()) run(() => navigator.clipboard?.writeText(x.key)); break;
  }
});
// Ctrl+V outside a text field adds the pasted issue key or Jira URL.
document.addEventListener("paste", e => {
  if (typing(e) || $("#app").classList.contains("hidden") || document.querySelector(".scrim")) return;
  const text = e.clipboardData?.getData("text")?.trim();
  if (text) { e.preventDefault(); addIssue(text.slice(0, 500)); }
});

/* ---------- issue panel: a slide-over on narrow windows, collapsible on wide ones ---------- */
const narrow = matchMedia("(max-width:820px)");
const saveAside = () => { prefs.asideClosed = document.body.classList.contains("aside-closed"); api("POST", "/api/settings", {asideClosed: prefs.asideClosed}).catch(() => {}); };
$("#asideBtn").onclick = () => { document.body.classList.toggle(narrow.matches ? "aside-open" : "aside-closed"); if (!narrow.matches) saveAside(); };
$("#asideClose").onclick = () => { document.body.classList.remove("aside-open"); if (!narrow.matches) { document.body.classList.add("aside-closed"); saveAside(); } };
document.addEventListener("keydown", e => { if (e.key === "Escape") document.body.classList.remove("aside-open"); });

/* ---------- update notice (only when the build knows its release repo) ---------- */
async function checkUpdateBanner() {
  if (!prefs.updateEnabled || prefs.updateCheck === false) return;
  try {
    const u = await api("GET", "/api/update");
    if (!u.newer) return;
    $("#updtext").textContent = t("upd.available", {0: u.latest});
    $("#updlink").textContent = t("upd.get"); $("#updlink").href = u.url;
    $("#updbar").classList.remove("hidden");
  } catch {}
}
$("#updx").onclick = () => $("#updbar").classList.add("hidden");

/* ---------- Jira server clock vs ours ---------- */
// Jira keeps the exact moment, but its reports group days by the server's clock. If the server is set to another
// zone than its users, tell the user and let them choose; the choice stays in Settings.
const clockVars = () => ({server: offsetLabel(clock.serverOffsetSec), local: offsetLabel(clock.localOffsetSec)});
async function setClock(patch) {
  try { await api("POST", "/api/settings", patch); clock = (await api("GET", "/api/session")).time; }
  catch (ex) { toast(ex.message, true); }
}
function clockNotice() {
  if (!clock || !clock.advice) return;
  const ask = clock.advice === "ask", key = clock.key;
  const btn = (text, cls, fn) => el("button", {type: "button", className: cls, textContent: text, onclick: fn});
  const {close} = modal(t("set.timeMode"), "", el("p", {textContent: t(ask ? "tm.body" : "tm.fixedBody", clockVars()), dir: "auto"}),
    close => ask ? [
      btn(t("tm.match"), "btn ghost", async () => { await setClock({timeMode: "server"}); close(); }),
      btn(t("tm.keep"), "btn", async () => { await setClock({timeAck: key}); close(); }),
    ] : [
      btn(t("tm.stay"), "btn ghost", async () => { await setClock({timeAck: "fixed"}); close(); }),
      btn(t("tm.switchBack"), "btn", async () => { await setClock({timeMode: ""}); close(); }),
    ]);
}

/* ---------- install updates ---------- */
async function updateFlow() {
  toast(t("upd.checking"));
  let u;
  try { u = await api("POST", "/api/update/check"); } catch (ex) { toast(ex.message, true); return; }
  if (!u.newer) { toast(t("upd.uptodate", {0: u.current})); return; }
  const info = el("div", {}, el("p", {textContent: t("upd.ask", {latest: u.latest, current: u.current})}));
  const status = el("div", {className: "hint"});
  const running = u.running || [];
  const go = el("button", {type: "submit", className: "btn", textContent: running.length ? t("upd.pauseUpdate") : t("upd.now")});
  // Running timers have to be settled first: pause them here, or close this and log them.
  if (running.length) info.append(el("p", {className: "hint", dir: "auto", textContent: t("upd.running", {0: running.join(", ")})}));
  if (!u.canInstall) {
    go.classList.add("hidden");
    info.replaceChildren(el("p", {textContent: t("err.updNoWrite")}), el("a", {href: u.url, target: "_blank", rel: "noopener", textContent: u.url, dir: "ltr"}));
  }
  info.append(status);
  const {close, form} = modal(t("upd.title"), u.latest, info, close => [el("button", {type: "button", className: "btn ghost", textContent: t("upd.later"), onclick: close}), go]);
  form.onsubmit = async e => {
    e.preventDefault(); go.disabled = true; status.textContent = t("upd.installing");
    try {
      if (running.length) { await api("POST", "/api/timers/pause-all"); refresh(); }
      const r = await api("POST", "/api/update/apply");
      status.textContent = t("upd.done", {0: r.version});
      // The new copy opens its own window; this one belongs to the old version, so close it (a browser only allows
      // this for app windows, which is what the app normally uses; otherwise the message stays for the user).
      setTimeout(() => { try { window.close(); } catch {} }, 2500);
    } catch (ex) {
      go.disabled = false; status.textContent = ""; status.append(ex.message);
      if (ex.message === t("err.updNoWrite")) status.append(" ", el("a", {href: u.url, target: "_blank", rel: "noopener", textContent: u.url, dir: "ltr"}));
    }
  };
}
$("#updlink").onclick = e => { e.preventDefault(); updateFlow(); };

/* ---------- boot ---------- */
setInterval(() => fetch("/api/ping").catch(() => {}), 10000);

(async () => {
  try {
    const s = await api("GET", "/api/session");
    prefs = s.prefs;
    await applyI18n();
    if (s.loggedIn) await enterApp(s.user, s);
    else if (s.hasSaved) {
      // Stay signed in: reuse the remembered credentials instead of asking again.
      let failure = "", failureCode = "";
      try { await enterApp((await api("POST", "/api/login", {})).user, await api("GET", "/api/session")); }
      catch (ex) { failure = ex.message; failureCode = ex.code || ""; }
      if (failure) {
        showLogin(s); $("#loginErr").textContent = failure;
        // No connection at start-up: the timers are still on this computer, so let the user reach them.
        if (String(failureCode).startsWith("err.unreachable")) {
          $("#offlineBtn").classList.remove("hidden");
          $("#offlineBtn").onclick = () => goOffline(s);
        }
      }
    } else showLogin(s);
  } catch (e) { document.body.textContent = e.message; }
})();
</script>
